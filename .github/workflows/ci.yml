name: CI

# One pipeline (replaces the former ci.yml + pages.yml + release.yml). The jobs run the SAME numbered
# scripts a student runs locally, so CI and local produce the same files with the same names.
#
#   windows / linux  build, test, every report (both families), Doxygen + DocFX, the app, and the
#                    per-platform release assets (7-build-all-<platform> --no-site). Upload artifacts.
#   macos            builds the app only (arm64) and packs it.
#   site             merges both platforms: MkDocs site + DocFX sites, link check, source/site zips,
#                    ASSETS.md, SHA256SUMS.txt. Uploads the site and the complete release/ folder.
#   deploy-pages     push to main (or manual): publish the site to the gh-pages branch. Private repos
#                    skip it unless the variable PAGES_ON_PRIVATE is "true" (notice + summary explain).
#   release          tag v*: create the GitHub Release with EVERY asset of release/ (one to one).
#
# Private repositories: Pages needs GitHub Pro/Team (or the Student Developer Pack). Releases work on
# Free. See docs/guide/showing-without-pages.en.md and docs/guide/releases-and-private-repos.en.md.
# Minutes: three runners per run; artifacts are kept 7 days.

on:
  push:
    branches: [ '**' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Python tools (MkDocs Material, coverxygen)
        run: python -m pip install -r requirements.txt
      - name: Install Doxygen, Graphviz and lcov
        shell: cmd
        run: choco install doxygen.install graphviz lcov -y --no-progress
      - name: 7-build-all-windows (build, tests, reports, API docs, app, release assets)
        shell: cmd
        run: |
          call .\7-build-all-windows.bat --no-site > build-all.log 2>&1
          set RC=%ERRORLEVEL%
          type build-all.log
          exit /b %RC%
      - name: Show the end of the build log as an annotation (visible without logging in)
        if: failure()
        shell: pwsh
        run: |
          $t = (Get-Content build-all.log -Tail 30) -join '%0A'
          Write-Output "::error title=7-build-all-windows failed (last 30 lines)::$t"
      - uses: actions/upload-artifact@v7
        with:
          name: platform-windows
          retention-days: 7
          if-no-files-found: error
          path: |
            release/*-windows-*
            reports/windows/**
            !reports/windows/_raw/**

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Python tools (MkDocs Material, coverxygen)
        run: python -m pip install -r requirements.txt
      - name: Install Doxygen, Graphviz and lcov
        run: |
          # a broken third-party apt source (e.g. packages.microsoft.com answering 403) must not fail the job
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list* /etc/apt/sources.list.d/microsoft-prod.sources*
          sudo apt-get update -o Acquire::Retries=3 || echo "::warning::apt-get update reported errors; installing from the existing package index"
          sudo apt-get install -y doxygen graphviz lcov zip
      - name: 7-build-all-linux (build, tests, reports, API docs, app, release assets)
        shell: bash
        run: |
          chmod +x *.sh scripts/*.sh
          ./7-build-all-linux.sh --no-site 2>&1 | tee build-all.log
      - name: Show the end of the build log as an annotation (visible without logging in)
        if: failure()
        shell: bash
        run: |
          t="$(tail -n 30 build-all.log | awk '{printf "%s%%0A", $0}')"
          echo "::error title=7-build-all-linux failed (last 30 lines)::$t"
      - uses: actions/upload-artifact@v7
        with:
          name: platform-linux
          retention-days: 7
          if-no-files-found: error
          path: |
            release/*-linux-*
            reports/linux/**
            !reports/linux/_raw/**

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Publish and pack the app (osx-arm64)
        run: |
          set -a; . ./project.env; set +a
          dotnet publish "$APP_PROJECT" -c Release -r osx-arm64 --self-contained true \
            --artifacts-path build/macos-release -o publish/macos-arm64 --nologo
          python3 scripts/site_tools.py pack-platform --platform macos --arch arm64 --app-only
      - uses: actions/upload-artifact@v7
        with:
          name: platform-macos
          retention-days: 7
          if-no-files-found: error
          path: release/*-macos-*

  site:
    needs: [ windows, linux, macos ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Python tools (MkDocs Material, coverxygen)
        run: python -m pip install -r requirements.txt
      # Windows/Linux artifacts contain release/* AND reports/<platform>/**, so their common root is the repo
      # root and the paths are kept. The macOS artifact is a single file: upload-artifact stores it WITHOUT
      # the release/ folder, so it must be downloaded into release/ explicitly.
      - uses: actions/download-artifact@v8
        with:
          name: platform-windows
      - uses: actions/download-artifact@v8
        with:
          name: platform-linux
      - uses: actions/download-artifact@v8
        with:
          name: platform-macos
          path: release
      - name: Build the MkDocs site, add both platforms' reports and the DocFX sites, check links, pack neutral assets
        run: |
          chmod +x scripts/*.sh
          ./scripts/build-site-linux.sh
          ls -1 release
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: site/
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: release-all
          path: |
            release/*
            build/release-notes.md
          retention-days: 7
          if-no-files-found: error

  deploy-pages:
    needs: site
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Decide whether to deploy Pages
        id: decide
        env:
          IS_PRIVATE: ${{ github.event.repository.private }}
          PAGES_ON_PRIVATE: ${{ vars.PAGES_ON_PRIVATE }}
          GUIDE_URL: ${{ github.server_url }}/${{ github.repository }}/blob/main/docs/guide/showing-without-pages.en.md
        run: |
          if [ "$IS_PRIVATE" = "true" ] && [ "$PAGES_ON_PRIVATE" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Pages deploy skipped::This repository is private; GitHub Pages needs GitHub Pro/Team (the free Student Developer Pack gives Pro). Show your project locally instead (7-build-all + 9-open-site, and the release/ folder): $GUIDE_URL . Once you have Pro and Pages is on, set the repository variable PAGES_ON_PRIVATE to true."
            {
              echo "## Pages deploy skipped"
              echo
              echo "This repository is **private**. GitHub Pages does not serve a private repository unless it has"
              echo "GitHub Pro/Team (the free [GitHub Student Developer Pack](https://education.github.com/pack) gives Pro)."
              echo
              echo "**What to do instead:** build and show everything locally (\`7-build-all-<platform>\`, then"
              echo "\`9-open-site-<platform>\`; the \`release/\` folder holds every output). Step by step, with the demo"
              echo "checklist: [Showing your project without GitHub Pages]($GUIDE_URL)."
              echo
              echo "To enable Pages later: get Pro, turn Pages on under **Settings -> Pages**, set the repository variable"
              echo "\`PAGES_ON_PRIVATE\` to \`true\` (**Settings -> Secrets and variables -> Actions -> Variables**) and re-run."
              echo "The site is also attached to every release as \`<project>-<version>-site.zip\`."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v8
        if: steps.decide.outputs.skip != 'true'
        with:
          name: site
          path: site
      - name: Deploy site/ to the gh-pages branch
        if: steps.decide.outputs.skip != 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          commit_message: "Deploy site for ${{ github.sha }}"
      - name: Live site URL in the job summary
        if: steps.decide.outputs.skip != 'true'
        run: |
          {
            echo "## Site deployed"
            echo
            echo "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: site
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release-all
      - name: Check the tag matches VERSION in project.env
        run: |
          set -a; . ./project.env; set +a
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match VERSION=${VERSION} in project.env (asset names use it). Fix project.env or the tag."
            exit 1
          fi
          ls -1 release
      - name: Note private-repository visibility
        if: github.event.repository.private == true
        run: |
          echo "::notice title=Private repository release::This release is visible only to collaborators. Add your instructor under Settings -> Collaborators."
      - uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body_path: build/release-notes.md
          files: release/*
