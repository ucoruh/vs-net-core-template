name: Build and Test

# Lean by design: restore, build, run the sample's unit tests with coverage, on both Windows and
# Ubuntu, on every push and PR. Nothing here publishes binaries, builds the DocFX site, or creates
# a release -- that is release.yml (manual/tag-triggered), or the local 10-release script. See
# docs/guide/releases-and-private-repos.en.md for the Actions-minutes trade-off.

on:
  push:
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET (version pinned in global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore CalculatorLibrary.sln

      - name: Build (Release; warnings are errors, see Directory.Build.props)
        run: dotnet build CalculatorLibrary.sln --configuration Release --no-restore

      - name: Test with coverage
        run: >
          dotnet test CalculatorLibrary.Tests/CalculatorLibrary.Tests.csproj
          --no-build --configuration Release --verbosity normal
          --collect:"XPlat Code Coverage" --settings CalculatorLibrary.Tests/coverlet.runsettings
          --results-directory TestResults
          --logger "trx;LogFileName=test-results.trx"

      - name: Coverage summary in the job summary
        if: always() && matrix.os == 'ubuntu-latest'
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: TestResults/**/coverage.cobertura.xml
          badge: false
          format: markdown
          output: both

      - name: Add coverage summary to job summary
        if: always() && matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          if [ -f code-coverage-results.md ]; then
            cat code-coverage-results.md >> "$GITHUB_STEP_SUMMARY"
          fi
