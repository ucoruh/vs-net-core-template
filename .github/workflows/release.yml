name: Release

# Alternative to running 10-release.bat/.sh locally: builds everything, packages binaries + every
# report (both families) + the whole site as site.zip + a source archive, and publishes a GitHub
# Release with softprops/action-gh-release -- the same idea the local `gh`-based 10-release script
# follows, so CI and local produce the same asset set. Triggered by pushing a "v*" tag or by hand
# (workflow_dispatch) -- never on an ordinary push, to avoid spending Actions minutes on every
# commit.
#
# Private repositories: unlike Pages (see pages.yml), Releases work the same on a private repo on
# GitHub Free (assets are simply visible only to collaborators) -- so this workflow always runs,
# private or public, and only adds a ::notice/step-summary explanation when the repo is private
# (no skip needed). See docs/guide/releases-and-private-repos.en.md.
#
# Minute cost: a full run (restore, build, test, Doxygen, DocFX site, 3 self-contained publishes)
# typically takes several minutes of your monthly Actions quota (2,000 min/month on GitHub Free).
# Prefer 10-release.bat/.sh locally if you are unsure how many minutes you have left.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. v1.2.0 (leave empty to use the VERSION file)'
        required: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET (version pinned in global.json)
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install coverxygen
        shell: cmd
        run: python -m pip install coverxygen

      - name: Install Doxygen, Graphviz and lcov
        shell: cmd
        run: choco install doxygen.install graphviz lcov -y

      - name: Restore local dotnet tools (ReportGenerator, DocFX)
        shell: cmd
        run: dotnet tool restore

      - name: Determine release tag
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            tag="${{ github.event.inputs.version }}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            tag="v$(cat VERSION)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Note private-repository visibility
        if: github.event.repository.private == true
        shell: bash
        run: |
          echo "::notice title=Private repository release::This release is only visible to collaborators (GitHub Releases work the same on Free and Pro for a private repo). Add your instructor as a collaborator so they can see it -- see docs/guide/releases-and-private-repos.en.md."
          {
            echo "## Private repository"
            echo
            echo "This release was built from a **private** repository. Releases are visible only to"
            echo "collaborators on GitHub Free -- add your instructor under **Settings -> Collaborators**"
            echo "so this release can be graded. See [Releases & private repositories]"
            echo "(../../blob/main/docs/guide/releases-and-private-repos.en.md)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build, test, generate reports and the site
        shell: cmd
        run: |
          call 7-build-app.bat
          if errorlevel 1 exit /b 1

      - name: Publish self-contained binaries
        shell: cmd
        run: |
          call dotnet publish CalculatorApp\CalculatorApp.csproj -c Release -r linux-x64 --self-contained true -o publish\linux
          if errorlevel 1 exit /b 1
          call dotnet publish CalculatorApp\CalculatorApp.csproj -c Release -r osx-x64 --self-contained true -o publish\macos
          if errorlevel 1 exit /b 1
          call dotnet publish CalculatorApp\CalculatorApp.csproj -c Release -r win-x64 --self-contained true -o publish\windows
          if errorlevel 1 exit /b 1

      - name: Package release assets
        shell: cmd
        run: |
          if not exist release mkdir release
          tar -czf release\linux-binaries.tar.gz -C publish\linux .
          tar -czf release\macos-binaries.tar.gz -C publish\macos .
          tar -czf release\windows-binaries.tar.gz -C publish\windows .
          tar -czf release\unit-test-results.tar.gz -C docs\testresults .
          tar -czf release\code-coverage-reportgenerator.tar.gz -C docs\coveragereport .
          if exist docs\coverage-genhtml tar -czf release\code-coverage-genhtml.tar.gz -C docs\coverage-genhtml .
          if exist docs\coverxygen tar -czf release\doc-coverage-genhtml.tar.gz -C docs\coverxygen .
          if exist docs\doccoverage-reportgenerator tar -czf release\doc-coverage-reportgenerator.tar.gz -C docs\doccoverage-reportgenerator .
          tar -czf release\doxygen-api-docs.tar.gz -C docs\doxygen\html .
          powershell -NoProfile -Command "Compress-Archive -Path 'site\*' -DestinationPath 'release\site.zip' -Force"
          if errorlevel 1 exit /b 1

      - name: Package a source archive
        shell: bash
        run: git archive --format=zip --output=release/source.zip "${{ github.sha }}"

      - name: Write release notes and release/README.md (link the live site, every report page and every asset)
        shell: bash
        env:
          SITE_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          {
            echo "# ${{ steps.version.outputs.tag }}"
            echo
            echo "Built by the \`release.yml\` GitHub Actions workflow."
            echo
            echo "## Live site"
            echo
            echo "(If Pages is not enabled for this repository, open \`site.zip\` below locally instead.)"
            echo
            echo "- Home: ${SITE_BASE_URL}"
            echo "- Unit test results: ${SITE_BASE_URL}docs/report-pages/unit-tests.html"
            echo "- Code coverage (ReportGenerator): ${SITE_BASE_URL}docs/report-pages/coverage-reportgenerator.html"
            echo "- Code coverage (genhtml): ${SITE_BASE_URL}docs/report-pages/coverage-genhtml.html"
            echo "- Documentation coverage (genhtml): ${SITE_BASE_URL}docs/report-pages/doccoverage-genhtml.html"
            echo "- Documentation coverage (ReportGenerator): ${SITE_BASE_URL}docs/report-pages/doccoverage-reportgenerator.html"
            echo "- Doxygen API docs: ${SITE_BASE_URL}docs/report-pages/doxygen-api.html"
            echo "- DocFX API reference: ${SITE_BASE_URL}docs/api/index.html"
            echo
            echo "- [Which report is which?](../../blob/main/docs/guide/reports-explained.en.md) explains every packaged report."
            echo "- [Releases & private repositories](../../blob/main/docs/guide/releases-and-private-repos.en.md) explains what a private repo can/cannot do."
            echo
            echo "## Assets"
            echo
            echo "See release/README.md (also attached below) -- the same table, generated once and reused."
            echo
            echo "## Commits"
            echo
          } > release/notes.md
          prevTag="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
          if [ -n "$prevTag" ]; then
            git log "$prevTag"..HEAD --oneline >> release/notes.md
          else
            git log -n 20 --oneline >> release/notes.md
          fi

          {
            echo "# Release assets -- ${{ steps.version.outputs.tag }}"
            echo
            echo "Everything in this folder is also attached to the GitHub Release. Unzip \`site.zip\`"
            echo "and open \`index.html\` for the full site, or open any archive below directly. Live"
            echo "site: ${SITE_BASE_URL}"
            echo
            echo "| Archive | Contents |"
            echo "|---|---|"
            echo "| \`windows-binaries.tar.gz\` | Self-contained \`win-x64\` publish of the sample app |"
            echo "| \`linux-binaries.tar.gz\` | Self-contained \`linux-x64\` publish of the sample app |"
            echo "| \`macos-binaries.tar.gz\` | Self-contained \`osx-x64\` publish of the sample app |"
            echo "| \`source.zip\` | Source archive at this tag (\`git archive\`) |"
            echo "| \`site.zip\` | The whole built site -- unzip, open \`index.html\` |"
            echo "| \`unit-test-results.tar.gz\` | Native VSTest HTML + TRX unit-test results |"
            echo "| \`code-coverage-reportgenerator.tar.gz\` | Code coverage, ReportGenerator HTML |"
            echo "| \`code-coverage-genhtml.tar.gz\` | Code coverage, native genhtml (lcov) |"
            echo "| \`doc-coverage-genhtml.tar.gz\` | Documentation coverage, native genhtml (lcov) |"
            echo "| \`doc-coverage-reportgenerator.tar.gz\` | Documentation coverage, ReportGenerator HTML |"
            echo "| \`doxygen-api-docs.tar.gz\` | Doxygen API reference (ecosystem-neutral; the DocFX-native API reference ships inside \`site.zip\`) |"
            echo "| \`notes.md\` | This release's GitHub Release description |"
            echo
            echo 'See docs/guide/reports-explained.en.md ("Which report is which?") for what each report shows.'
          } > release/README.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body_path: release/notes.md
          files: release/*
